# Include inside the existing shtabix.ru TLS server block before location /.
location = /internal/tv-screenshot {
    proxy_pass http://127.0.0.1:3012/snapshot$is_args$args;
    proxy_set_header X-Brixton-Timestamp $http_x_brixton_timestamp;
    proxy_set_header X-Brixton-Signature $http_x_brixton_signature;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 10s;
    client_max_body_size 1k;
    add_header Cache-Control "no-store" always;
}
